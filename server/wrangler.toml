name = "tab-daddy-names"
main = "src/index.js"
compatibility_date = "2026-09-01"

# One public address only; no per-version preview copies.
workers_dev = true
preview_urls = false

# Nothing about requests is logged: the words users send are not stored here.
[observability]
enabled = false

[vars]
GROQ_MODEL = "openai/gpt-oss-20b"
# Comma-separated chrome-extension://<id> origins. Empty allows any extension
# origin (handy while testing an unpacked copy); set it to the store ID for release.
ALLOWED_ORIGINS = ""

# Per-install limit, so one user can't use up the shared daily allowance.
[[ratelimits]]
name = "PER_INSTALL"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

# Shared name cache across all users. Create it with:
#   npx wrangler kv namespace create NAMES
# and paste the id it prints below.
[[kv_namespaces]]
binding = "NAMES"
id = "10bee68159b346ec85c24c616dd78893"

# The Groq key is a secret, never in this file:
#   npx wrangler secret put GROQ_API_KEY
